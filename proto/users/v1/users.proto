syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "shared/proto/users;users";

service UsersService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  rpc RegisterContact(RegisterContactRequest) returns (RegisterContactResponse);

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc RestoreUser(RestoreUserRequest) returns (RestoreUserResponse);

  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);

  rpc GetUserSummary(GetUserSummaryRequest) returns (GetUserSummaryResponse);

  rpc GetUsersSummary(GetUsersSummaryRequest) returns (GetUsersSummaryResponse);

  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  rpc UserExists(UserExistsRequest) returns (UserExistsResponse);

  rpc UsersExist(UsersExistRequest) returns (UsersExistResponse);

  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns (GetPrivacySettingsResponse);

  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns (UpdatePrivacySettingsResponse);
}

enum Visibility {
  EVERYONE = 0;
  FRIENDS = 1;
  CONTACTS = 2;
  NOBODY = 3;
}

enum AccountBadge {
  UNVERIFIED = 0;
  BLUE_BADGE = 1;
  GOLD_BADGE = 2;
  SILVER_BADGE = 3;
}

message User {
  string id = 1;

  string username = 2;

  string display_name = 3;

  string email = 4;

  string phone = 5;

  string profile_image_url = 6;

  string bio = 7;

  string bio_status = 8;

  AccountBadge account_badge = 9;

  uint32 friends_count = 10;

  uint32 followers_count = 11;

  uint32 following_count = 12;

  uint32 posts_count = 13;

  google.protobuf.Timestamp birth_date = 14;

  google.protobuf.Timestamp created_at = 15;

  google.protobuf.Timestamp updated_at = 16;
}

message UserSummary {
  string id = 1;

  string username = 2;

  string display_name = 3;

  string phone_number = 4;

  string profile_image_url = 5;

  AccountBadge account_badge = 6;
}

message PrivacySettings {
  Visibility avatar_visibility = 1;

  Visibility phone_visibility = 2;

  Visibility email_visibility = 3;

  Visibility last_seen_visibility = 4;

  bool read_receipts_enabled = 5;

  bool find_by_username = 6;
}

message CreateUserRequest {
  oneof contact {
    string email = 1;
    string phone = 2;
  }
}

message CreateUserResponse {
  User user = 1;
}

message RegisterContactRequest {
  string user_id = 1;
  oneof contact_type {
    string phone = 2;
    string email = 3;
  }
}

message RegisterContactResponse {}

message UpdateUserRequest {
  string id = 1;

  optional string username = 2;

  optional string display_name = 3;

  optional string profile_image_url = 6;

  optional string bio = 7;

  optional string bio_status = 8;

  optional AccountBadge account_badge = 11;

  optional uint32 friends_count = 12;

  optional uint32 followers_count = 13;

  optional uint32 following_count = 14;

  optional uint32 posts_count = 15;

  optional google.protobuf.Timestamp birth_date = 16;
}

message UpdateUserResponse {}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message RestoreUserRequest {
  string id = 1;
}

message RestoreUserResponse {}

message GetUserRequest {
  oneof lookup {
    string id = 1;

    string username = 2;

    string email = 3;

    string phone = 4;
  }
}

message GetUserResponse {
  User user = 1;
  PrivacySettings privacy_settings = 2;
}

message GetUsersRequest {
  repeated string user_ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

message GetUserSummaryRequest {
  string id = 1;
}

message GetUserSummaryResponse {
  UserSummary user = 1;
}

message GetUsersSummaryRequest {
  repeated string user_ids = 1;
}

message GetUsersSummaryResponse {
  repeated UserSummary users = 1;
}

message SearchUsersRequest {
  string query = 1;

  uint32 page = 2;

  uint32 page_size = 3;
}

message SearchUsersResponse {
  repeated UserSummary users = 1;

  bool has_more = 3;
}

message UserExistsRequest {
  oneof lookup {
    string id = 1;

    string username = 2;

    string email = 3;

    string phone = 4;
  }
}

message UserExistence {
  string user_id = 1;

  bool exists = 2;
}

message UserExistsResponse {
  UserExistence response = 1;
}

message UsersExistRequest {
  repeated string user_ids = 1;
}

message UsersExistResponse {
  repeated UserExistence users = 1;
}

message GetPrivacySettingsRequest {
  string user_id = 1;
}

message GetPrivacySettingsResponse {
  PrivacySettings settings = 1;
}

message UpdatePrivacySettingsRequest {
  string user_id = 1;

  optional Visibility avatar_visibility = 2;
  optional Visibility phone_visibility = 3;
  optional Visibility email_visibility = 4;
  optional Visibility last_seen_visibility = 5;

  optional bool read_receipts_enabled = 6;
  optional bool find_by_username = 7;
}

message UpdatePrivacySettingsResponse {}
