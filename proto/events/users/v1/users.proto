syntax = "proto3";

package events.users.v1;

option go_package = "shared/events/users;users_events";

message UserRegistered {
  string id = 1;
}

message ContactRegistered {
  string user_id = 1;

  oneof contact {
    string phone = 2;
    string email = 3;
  }
}

message UserUpdated {
    string user_id = 1;

    string field = 2;

    string value = 3;
}

message UserDeleted {}

message UserRestored {}
