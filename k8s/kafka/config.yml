apiVersion: v1
kind: ConfigMap

metadata:
  name: kafka-config
  namespace: kafka

data:
  # Use the fully-qualified cluster-local DNS name so this ConfigMap can be
  # consumed by pods in ANY namespace (e.g. default or kafka).
  KAFKA_BROKERS: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  KAFKA_MECHANISM: SCRAM-SHA-512
  KAFKA_TLS_ENABLED: "false"
